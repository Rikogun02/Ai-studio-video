name: Validate video studio
on:
  push:
    branches: [main, termux-render-v1]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m py_compile app/main.py app/termux_package.py termux/render.py
